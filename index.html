<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shubham Maharu | SEO, AEO and AI Search Specialist, London</title>
<meta name="description" content="Portfolio of Shubham Maharu, a London-based digital marketing specialist working on technical SEO, content strategy and AI search.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Sans:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2e8;--paper:#fffdf7;--ink:#17160f;--muted:#55524a;--blue:#1b44e0;--sel:#c3d3fb;--yellow:#f6c524;--line:#17160f;
--disp:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--pix:"Silkscreen","Courier New",monospace;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16150f;--paper:#211f17;--ink:#f3efe4;--muted:#b9b4a6;--blue:#8aa8ff;--sel:#2b3f8f;--line:#f3efe4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16150f;--paper:#211f17;--ink:#f3efe4;--muted:#b9b4a6;--blue:#8aa8ff;--sel:#2b3f8f;--line:#f3efe4;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg) radial-gradient(circle,rgba(120,115,95,.28) 1px,transparent 1.4px) 0 0/22px 22px;color:var(--ink);font:400 1.0625rem/1.65 var(--body);min-height:100%}
img{max-width:100%;height:auto;display:block}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--bg);padding:10px 14px;z-index:9}.skip:focus{top:12px}
.wrap{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
nav{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:space-between;align-items:center;padding:18px 0}
nav b{font:800 1.15rem var(--disp)}
nav ul{display:flex;flex-wrap:wrap;gap:4px 18px;list-style:none;margin:0;padding:0}
nav a{color:var(--ink);font-weight:500;text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent}
nav a:hover{border-color:var(--blue)}
section{padding:clamp(40px,7vw,84px) 0}
h1,h2,h3{font-family:var(--disp);line-height:1.02;margin:0}
.win{background:var(--paper);border:2px solid var(--line);border-radius:14px;box-shadow:6px 6px 0 var(--line);overflow:hidden}
.bar{display:flex;gap:7px;align-items:center;padding:9px 14px;border-bottom:2px solid var(--line);font:700 .8rem var(--pix);background:var(--yellow);color:#17160f}
.bar i{width:11px;height:11px;border:2px solid #17160f;border-radius:50%;display:block}
.bar span{margin-left:8px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(20px,4vw,48px);padding:clamp(20px,4vw,44px);align-items:center}
.pix{font:700 clamp(2rem,10.5vw,5.6rem)/1 var(--pix);margin:0;letter-spacing:-.02em;display:flex;flex-wrap:wrap}
.pix span:nth-child(2){background:var(--blue);color:#fff;padding:0 .08em;transform:rotate(-4deg)}
.pix span:nth-child(5){color:var(--yellow);-webkit-text-stroke:2px var(--ink)}
h1{font-size:clamp(2.6rem,8.5vw,5.4rem);font-weight:800;letter-spacing:-.035em;margin:.12em 0 .15em}
.role{font:500 1.2rem/1.3 var(--disp);margin:0}
.tags{font:700 .9rem var(--pix);color:var(--blue);margin:10px 0 18px}
.intro{max-width:34em;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 0}
.btn{display:inline-block;font:700 1rem var(--body);padding:12px 20px;border:2px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--line);transition:transform .12s}
.btn.main{background:var(--blue);color:#fff}
.btn:hover{transform:translate(-1px,-1px)}
.collage{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:2px solid var(--line);border-radius:8px;background:var(--paper);min-height:118px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:.78rem;line-height:1.3;position:relative;overflow:hidden}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.ph{border-style:dashed;color:var(--muted)}
.tile:nth-child(1){transform:rotate(-2deg)}.tile:nth-child(2){transform:rotate(1.5deg);background:#fbe58a}
.tile:nth-child(3){transform:rotate(1deg);background:#d9e2ff}.tile:nth-child(4){transform:rotate(-1.5deg)}
.tile b{display:block;font-family:var(--pix);font-size:.7rem;color:var(--ink)}
.mono{grid-column:1/-1;justify-self:center;width:112px;height:112px;margin:-6px 0;border-radius:50%;border:3px solid var(--line);background:var(--blue);color:#fff;font:800 2.5rem var(--disp);display:grid;place-items:center;z-index:2;position:relative;box-shadow:0 0 0 6px var(--yellow);overflow:hidden}
.mono img{width:100%;height:100%;object-fit:cover}
.folders{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:clamp(22px,4vw,36px)}
.folder{background:none;border:0;font:500 .95rem var(--body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:132px;padding:8px;text-align:center}
.folder svg{width:76px;height:auto;transition:transform .15s}
.folder:hover svg{transform:translateY(-3px)}
.folder:hover span{text-decoration:underline}
h2{font-size:clamp(2.1rem,6vw,3.8rem);font-weight:800;letter-spacing:-.03em;margin-bottom:.5em}
::selection{background:var(--sel)}
.hl{background:var(--sel);color:var(--ink);font-style:italic;padding:0 .12em;border-left:3px solid var(--blue);border-right:3px solid var(--blue);position:relative;display:inline-block}
.hl::after{content:"";position:absolute;right:-9px;bottom:-12px;width:14px;height:14px;border-radius:50%;background:var(--blue)}
.about{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(24px,5vw,56px)}
.about p{max-width:38em;margin:0 0 1em}
.facts{display:grid;gap:18px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:18px 20px}
.card h3{font:700 1.1rem var(--pix);margin-bottom:10px}
.card ul{margin:0;padding-left:1.1em}.card li{margin:.3em 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.chips li{margin:0;background:var(--sel);border-radius:999px;padding:3px 12px;font-size:.92rem}
.case{background:var(--paper);border:2px solid var(--line);border-radius:12px;margin-bottom:18px;box-shadow:5px 5px 0 var(--line)}
.case>h3{margin:0;font-size:1rem}
.case>h3 button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;justify-content:space-between;width:100%;padding:18px 20px}
.case>h3 button:focus-visible{outline:3px solid var(--blue);outline-offset:-3px;border-radius:10px}
.ct{font:800 clamp(1.3rem,3.6vw,1.9rem)/1.1 var(--disp);display:block}
.cs{display:block;font:500 .95rem var(--body);color:var(--muted);margin-top:4px}
.badge{display:inline-block;font:700 .7rem var(--pix);background:var(--yellow);color:#17160f;border:2px solid var(--ink);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.plus{flex:none;width:34px;height:34px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font:700 1.3rem var(--body);transition:transform .2s}
[aria-expanded="true"] .plus{transform:rotate(45deg)}
.panel{padding:4px 20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.panel[hidden]{display:none}
.panel h4{font:700 .85rem var(--pix);color:var(--blue);margin:0 0 4px}
.panel p,.panel ul{margin:0 0 14px}.panel ul{padding-left:1.1em}
.slot{border:2px dashed var(--muted);border-radius:10px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--muted);background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(120,115,95,.08) 10px 20px);font-size:.92rem}
.slot b{color:var(--ink);font-family:var(--pix);font-size:.8rem}
.slot img{border-radius:8px}
.proves{grid-column:1/-1;border-left:5px solid var(--yellow);padding:4px 0 4px 14px;font-weight:500;margin:0}
.teach{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,44px);padding:clamp(20px,4vw,40px)}
.contact{text-align:center}
.contact .btns{justify-content:center}
.ph-link{display:inline-block;border:2px dashed var(--muted);border-radius:999px;padding:11px 20px;color:var(--muted)}
footer{padding:28px 0 40px;color:var(--muted);font-size:.9rem;text-align:center}
@media(max-width:820px){.hero,.about,.teach,.panel{grid-template-columns:1fr}.folder{width:calc(50% - 14px)}}
@media(max-width:420px){.folder{width:100%;flex-direction:row;text-align:left}.tile{min-height:96px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#work">Skip to selected work</a>
<div class="wrap">
<nav aria-label="Main"><b id="navName"></b>
<ul><li><a href="#about">About</a></li><li><a href="#work">Selected work</a></li><li><a href="#teaching">Teaching</a></li><li><a href="#contact">Contact</a></li></ul></nav>
</div>
<main id="top">
<div class="wrap">
<div class="win"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>portfolio.search</span></div>
<div class="hero">
<div>
<p class="pix" aria-label="Portfolio"><span>P</span><span>O</span><span>R</span><span>T</span><span>F</span><span>O</span><span>L</span><span>I</span><span>O</span></p>
<h1 id="heroName"></h1>
<p class="role" id="heroRole"></p>
<p class="tags" id="heroTags"></p>
<p class="intro" id="heroIntro"></p>
<div class="btns"><a class="btn main" href="#work">View my work</a><a class="btn" href="#contact">Get in touch</a></div>
</div>
<div class="collage" id="collage" role="group" aria-label="Collage of work samples"></div>
</div>
</div>
<div class="folders" id="folders" role="group" aria-label="Open a project folder"></div>
</div>

<section id="about" class="wrap" aria-labelledby="aboutH">
<h2 id="aboutH">Hi, I’m <span class="hl">Shubham.</span></h2>
<div class="about"><div id="aboutCopy"></div><div class="facts" id="facts"></div></div>
</section>

<section id="work" class="wrap" aria-labelledby="workH">
<h2 id="workH">Selected work</h2><div id="cases"></div>
</section>

<section id="teaching" class="wrap" aria-labelledby="teachH">
<h2 id="teachH">Teaching &amp; training</h2>
<div class="win"><div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>intech-centre/teaching</span></div><div class="teach" id="teach"></div></div>
</section>

<section id="contact" class="wrap contact" aria-labelledby="contactH">
<h2 id="contactH">Let’s talk about your project</h2>
<div class="btns" id="links"></div>
</section>
</main>
<footer class="wrap"><span id="foot"></span></footer>

<script>
/* ============ EDIT HERE: all copy, image paths and contact details live in SITE ============ */
const SITE = {
  name: "Shubham Maharu",
  navName: "Shubham Maharu",
  role: "Digital Marketing Specialist & Project Coordinator",
  tags: "SEO · AEO · AI Search",
  intro: "I help businesses improve how they’re found in Google and AI-powered search through technical SEO, content strategy and on-page optimisation.",
  contact: {
    email: "",     // e.g. "name@example.com" (leave blank until supplied)
    linkedin: ""   // e.g. "https://www.linkedin.com/in/your-profile"
  },
  images: {        // Paths or URLs. Leave "" to show a placeholder. Add alt text beside each.
    portrait:      { src: "", alt: "Shubham Maharu, cut-out portrait" },
    searchConsole: { src: "", alt: "Google Search Console performance screenshot" },
    article:       { src: "", alt: "Published article preview" },
    brightonSeo:   { src: "", alt: "Shubham at BrightonSEO" },
    teaching:      { src: "", alt: "Teaching resource preview" }
  },
  collageLabels: { searchConsole: "Search Console screenshot", article: "Published article", brightonSeo: "BrightonSEO photo", teaching: "Teaching resource" },
  folders: [
    { label: "SEO & Content", open: ["intech", "exam"] },
    { label: "AI Search Strategy", open: ["jennings"] },
    { label: "Teaching & Training", goto: "#teaching" }
  ],
  about: [
    "I’m a digital marketing specialist based in London. I work across technical SEO, content strategy and AI search, using Google Search Console and GA4 to understand how people find a website and where it can improve.",
    "At Intech Centre, I also teach digital marketing and coordinate training programmes. I help learners apply what they study to practical work, from keyword research to website audits."
  ],
  experience: ["Intech Centre: Digital Marketing Specialist & Project Coordinator", "Gems Digital Media: Digital Marketing Executive", "Elsner Technologies: SEO Executive"],
  education: ["MSc Marketing, The University of Law"],
  skills: ["Technical SEO", "Keyword research", "Content optimisation", "AEO", "AI search", "GA4", "Google Search Console"],
  cases: [
    { id: "intech", title: "Intech Centre", sub: "Organic Search & Content", status: "Professional work",
      role: "SEO and content work for Intech Centre’s website.",
      did: ["BrightonSEO recap content", "ESOL with Employability enquiry page"],
      evidenceKey: "searchConsole", evidenceLabel: "Analytics visual", evidenceNote: "Add approved Search Console or GA4 data with its date range. No results are claimed until then.",
      proves: "I can turn course and event content into pages built around how people search." },
    { id: "exam", title: "Exam Centre", sub: "Functional Skills Content SEO", status: "Content project",
      role: "Keyword research and search-intent planning for an article.",
      did: ["Researched what people looking for Functional Skills English exams search for", "Shaped the article around that intent"],
      evidenceKey: "article", evidenceLabel: "Article preview", evidenceNote: "Add a screenshot of the article and its exact published URL: [published URL to add].",
      proves: "I use keyword research and intent to decide what an article should cover." },
    { id: "jennings", title: "Jennings Plumbing Services", sub: "30-Day Local SEO & AI Search Plan", status: "Strategy sample",
      role: "Author of a sample roadmap, not a live client campaign.",
      did: ["A 30-day plan covering local SEO and AI search visibility for a plumbing business"],
      evidenceKey: "", evidenceLabel: "Roadmap excerpt", evidenceNote: "Add an excerpt of the plan. Implementation details or results only if you supply them.",
      proves: "I can plan local SEO and AI search work in clear, time-boxed steps." }
  ],
  teaching: {
    copy: "I teach digital marketing and coordinate programmes at Intech Centre, including London Talent Pathways and the Digital Marketing & AI Skills Bootcamp.",
    programmes: ["London Talent Pathways", "Digital Marketing & AI Skills Bootcamp"],
    resourceKey: "teaching", resourceLabel: "Teaching resource", resourceNote: "Add a website audit checklist or keyword research exercise (no learner data)."
  },
  footer: "© Shubham Maharu. Built as a static page; edit SITE to update."
};
/* ================================== END OF EDITABLE CONTENT ================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img = k => SITE.images[k] || {src:"",alt:""};
const media = (k, label, cls) => { const m = img(k);
  return m.src ? `<div class="${cls}"><img src="${esc(m.src)}" alt="${esc(m.alt)}" loading="lazy"></div>`
  : `<div class="${cls} ph"><span><b>Replace: ${esc(label)}</b><br>SITE.images.${k}</span></div>`; };

$("navName").textContent = SITE.navName;
$("heroName").textContent = SITE.name;
$("heroRole").textContent = SITE.role;
$("heroTags").textContent = SITE.tags;
$("heroIntro").textContent = SITE.intro;
$("foot").textContent = SITE.footer;

const L = SITE.collageLabels, p = img("portrait");
$("collage").innerHTML =
  media("searchConsole", L.searchConsole, "tile") + media("article", L.article, "tile") +
  `<div class="mono">${p.src ? `<img src="${esc(p.src)}" alt="${esc(p.alt)}">` : `<span role="img" aria-label="Monogram SM, replace with portrait">SM</span>`}</div>` +
  media("brightonSeo", L.brightonSeo, "tile") + media("teaching", L.teaching, "tile");

const folderSvg = '<svg viewBox="0 0 80 64" aria-hidden="true"><path d="M4 10a6 6 0 0 1 6-6h20l8 8h32a6 6 0 0 1 6 6v36a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6z" fill="#1b44e0" stroke="#17160f" stroke-width="3"/><path d="M4 22h72" stroke="#fff" stroke-opacity=".45" stroke-width="3"/><circle cx="64" cy="14" r="4" fill="#f6c524" stroke="#17160f" stroke-width="2"/></svg>';
$("folders").innerHTML = SITE.folders.map((f,i) => `<button class="folder" data-i="${i}">${folderSvg}<span>${esc(f.label)}</span></button>`).join("");

$("aboutCopy").innerHTML = SITE.about.map(t => `<p>${esc(t)}</p>`).join("");
const list = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
$("facts").innerHTML =
  `<div class="card"><h3>Experience</h3>${list(SITE.experience)}</div>` +
  `<div class="card"><h3>Education</h3>${list(SITE.education)}</div>` +
  `<div class="card"><h3>Skills</h3><ul class="chips">${SITE.skills.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`;

$("cases").innerHTML = SITE.cases.map(c => {
  const ev = c.evidenceKey && img(c.evidenceKey).src ? media(c.evidenceKey, c.evidenceLabel, "slot") : "";
  const slot = ev || `<div class="slot"><b>Replace: ${esc(c.evidenceLabel)}</b><span>${esc(c.evidenceNote)}</span></div>`;
  return `<article class="case" id="case-${c.id}"><h3><button aria-expanded="false" aria-controls="p-${c.id}">
    <span><span class="badge">${esc(c.status)}</span><span class="ct">${esc(c.title)}</span><span class="cs">${esc(c.sub)}</span></span><span class="plus" aria-hidden="true">+</span></button></h3>
    <div class="panel" id="p-${c.id}" hidden><div><h4>My contribution</h4><p>${esc(c.role)}</p><h4>What I worked on</h4>${list(c.did)}</div>${slot}
    <p class="proves"><strong>What this proves:</strong> ${esc(c.proves)}</p></div></article>`;
}).join("");

const T = SITE.teaching;
$("teach").innerHTML = `<div><p>${esc(T.copy)}</p>${list(T.programmes)}</div>` +
  (img(T.resourceKey).src ? media(T.resourceKey, T.resourceLabel, "slot") : `<div class="slot"><b>Replace: ${esc(T.resourceLabel)}</b><span>${esc(T.resourceNote)}</span></div>`);

const C = SITE.contact;
$("links").innerHTML =
  (C.email ? `<a class="btn main" href="mailto:${esc(C.email)}">Email me</a>` : `<span class="ph-link">Email address to add in SITE.contact.email</span>`) +
  (C.linkedin ? `<a class="btn" href="${esc(C.linkedin)}" rel="noopener">View LinkedIn</a>` : `<span class="ph-link">LinkedIn URL to add in SITE.contact.linkedin</span>`);

function setCase(id, open){ const b = document.querySelector(`#case-${id} button`), pn = $("p-"+id);
  b.setAttribute("aria-expanded", open); pn.hidden = !open; }
document.querySelectorAll(".case button").forEach(b => b.addEventListener("click", () =>
  setCase(b.closest(".case").id.slice(5), b.getAttribute("aria-expanded") !== "true")));
document.querySelectorAll(".folder").forEach(btn => btn.addEventListener("click", () => {
  const f = SITE.folders[btn.dataset.i];
  if (f.goto) { const t = document.querySelector(f.goto); t.scrollIntoView(); t.setAttribute("tabindex","-1"); t.focus({preventScroll:true}); return; }
  SITE.cases.forEach(c => setCase(c.id, f.open.includes(c.id)));
  const first = document.querySelector(`#case-${f.open[0]}`); first.scrollIntoView();
  first.querySelector("button").focus({preventScroll:true});
}));
</script>
</body>
</html>
